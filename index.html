 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação Meteorológica Pro | Modo Manual</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #1e293b 50%, #0369a1 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.6);
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        .weather-shape-1, .weather-shape-2 {
            position: absolute;
            border-radius: 50%;
            z-index: 0;
            filter: blur(60px);
        }
        .weather-shape-1 {
            width: 300px;
            height: 300px;
            background: rgba(56, 189, 248, 0.15);
            top: -50px;
            left: -50px;
        }
        .weather-shape-2 {
            width: 350px;
            height: 350px;
            background: rgba(14, 165, 233, 0.1);
            bottom: -50px;
            right: -50px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 1;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .weather-widget {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            padding: 0.75rem 1rem;
            border-radius: 14px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(2, 132, 199, 0.2);
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .weather-info svg {
            width: 28px;
            height: 28px;
            fill: var(--primary);
        }

        .weather-text span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .weather-text strong {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .weather-temp {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-box {
            font-size: 0.8rem;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-bottom: 1.25rem;
            text-align: center;
            font-weight: 500;
            background-color: #f0f9ff;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-main);
            background-color: #ffffff;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        button {
            width: 100%;
            padding: 0.9rem 1rem;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
            margin-top: 0.5rem;
        }

        button:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
            transform: translateY(-1px);
        }

        #success-screen {
            display: none;
            text-align: center;
            padding: 2rem 0;
        }

        #success-screen h2 {
            color: var(--success);
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        #success-screen p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer-info {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="weather-shape-1"></div>
    <div class="weather-shape-2"></div>

    <div class="container">
        <!-- Formulário Principal -->
        <div id="form-container">
            <div class="weather-widget">
                <div class="weather-info">
                    <svg viewBox="0 0 24 24">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.39 2.78 2.96 0 1.65-1.35 3-3 3z"/>
                    </svg>
                    <div class="weather-text">
                        <span>Condição Atmosférica</span>
                        <strong>Sistema Operacional</strong>
                    </div>
                </div>
                <div class="weather-temp">24°C</div>
            </div>

            <header>
                <h1>Telemetria de Campo</h1>
                <p>Preenchimento Manual Habilitado</p>
            </header>

            <div class="status-box">
                <span>Campos abertos para digitação livre.</span>
            </div>

            <form id="locationForm">
                <div class="form-group">
                    <label for="local"><span>Local / Endereço</span> <span>Livre</span></label>
                    <input type="text" id="local" name="entry.773170880" placeholder="Digite o local (Ex: São Paulo - SP)" required>
                </div>

                <div class="form-group">
                    <label for="latitude"><span>Latitude</span> <span>Livre</span></label>
                    <input type="text" id="latitude" name="entry.1776832054" placeholder="Ex: -23.550520" required>
                </div>

                <div class="form-group">
                    <label for="longitude"><span>Longitude</span> <span>Livre</span></label>
                    <input type="text" id="longitude" name="entry.374965073" placeholder="Ex: -46.633308" required>
                </div>

                <button type="submit" id="submitBtn">Transmitir Dados para o Google Forms</button>
            </form>

            <div class="footer-info">
                Segurança SSL • Encriptação Ativa
            </div>
        </div>

        <!-- Tela de Sucesso -->
        <div id="success-screen">
            <h2>Transmissão Concluída!</h2>
            <p>Os dados informados foram salvos com sucesso no sistema.</p>
        </div>
    </div>

    <script>
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSc07W2nfckvU6-mTDKKScpqS9h4J1PFgErkM6gi8vJSh_O4aA/formResponse";
        
        const locationForm = document.getElementById('locationForm');
        const formContainer = document.getElementById('form-container');
        const successScreen = document.getElementById('success-screen');
        const submitBtn = document.getElementById('submitBtn');

        locationForm.addEventListener('submit', (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "Transmitindo...";

            const formData = new URLSearchParams();
            formData.append('entry.773170880', document.getElementById('local').value);
            formData.append('entry.1776832054', document.getElementById('latitude').value);
            formData.append('entry.374965073', document.getElementById('longitude').value);

            fetch(FORM_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            })
            .then(() => {
                formContainer.style.display = 'none';
                successScreen.style.display = 'block';
            })
            .catch((err) => {
                console.error("Erro no envio:", err);
                formContainer.style.display = 'none';
                successScreen.style.display = 'block';
            });
        });
    </script>
</body>
</html>
