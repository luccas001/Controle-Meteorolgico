<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação Meteorológica Pro | Captura de Localização</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #1e293b 50%, #0369a1 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.6);
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Formas atmosféricas abstratas ao fundo */
        .weather-shape-1, .weather-shape-2 {
            position: absolute;
            border-radius: 50%;
            z-index: 0;
            filter: blur(60px);
        }
        .weather-shape-1 {
            width: 300px;
            height: 300px;
            background: rgba(56, 189, 248, 0.15);
            top: -50px;
            left: -50px;
        }
        .weather-shape-2 {
            width: 350px;
            height: 350px;
            background: rgba(14, 165, 233, 0.1);
            bottom: -50px;
            right: -50px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            z-index: 1;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        /* Widget de Clima Flutuante no Topo */
        .weather-widget {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            padding: 0.75rem 1rem;
            border-radius: 14px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(2, 132, 199, 0.2);
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .weather-info svg {
            width: 28px;
            height: 28px;
            fill: var(--primary);
        }

        .weather-text span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .weather-text strong {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .weather-temp {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-box {
            font-size: 0.8rem;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-bottom: 1.25rem;
            text-align: center;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-box.loading {
            background-color: #f0f9ff;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        .status-box.success {
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .status-box.error {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: currentColor;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.6); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(2, 132, 199, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-main);
            background-color: #ffffff;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        input[readonly] {
            background-color: #f8fafc;
            color: #475569;
            border-color: #e2e8f0;
            cursor: not-allowed;
        }

        button {
            width: 100%;
            padding: 0.9rem 1rem;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
            margin-top: 0.5rem;
        }

        button:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #success-screen {
            display: none;
            text-align: center;
            padding: 2rem 0;
        }

        #success-screen h2 {
            color: var(--success);
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        #success-screen p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer-info {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="weather-shape-1"></div>
    <div class="weather-shape-2"></div>

    <div class="container">
        <!-- Formulário Principal -->
        <div id="form-container">
            <!-- Widget de Clima Simulado -->
            <div class="weather-widget">
                <div class="weather-info">
                    <svg viewBox="0 0 24 24">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.39 2.78 2.96 0 1.65-1.35 3-3 3z"/>
                    </svg>
                    <div class="weather-text">
                        <span>Condição Atmosférica</span>
                        <strong id="weatherCondition">Varredura de Satélite</strong>
                    </div>
                </div>
                <div class="weather-temp" id="weatherTemp">--°C</div>
            </div>

            <header>
                <h1>Telemetria de Campo</h1>
                <p>Captura automática de coordenadas geográficas</p>
            </header>

            <div id="geo-status" class="status-box loading">
                <div class="pulse-dot"></div>
                <span>Conectando com os satélites de GPS...</span>
            </div>

            <form id="locationForm">
                <div class="form-group">
                    <label for="local"><span>Local / Endereço</span> <span>Auto</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="local" name="entry.773170880" placeholder="Aguardando dados..." readonly required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="latitude"><span>Latitude</span> <span>GPS</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="latitude" name="entry.1776832054" placeholder="0.000000" readonly required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="longitude"><span>Longitude</span> <span>GPS</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="longitude" name="entry.374965073" placeholder="0.000000" readonly required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" disabled>Transmitir Dados para o Google Forms</button>
            </form>

            <div class="footer-info">
                Segurança SSL • Encriptação Ativa
            </div>
        </div>

        <!-- Tela de Sucesso -->
        <div id="success-screen">
            <h2>Transmissão Concluída!</h2>
            <p>Os dados de posição e clima foram salvos com sucesso no sistema.</p>
        </div>
    </div>

    <script>
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSc07W2nfckvU6-mTDKKScpqS9h4J1PFgErkM6gi8vJSh_O4aA/formResponse";
        
        const inputLocal = document.getElementById('local');
        const inputLat = document.getElementById('latitude');
        const inputLng = document.getElementById('longitude');
        const geoStatus = document.getElementById('geo-status');
        const submitBtn = document.getElementById('submitBtn');
        const locationForm = document.getElementById('locationForm');
        const formContainer = document.getElementById('form-container');
        const successScreen = document.getElementById('success-screen');
        const weatherCondition = document.getElementById('weatherCondition');
        const weatherTemp = document.getElementById('weatherTemp');

        // Simula dados meteorológicos dinâmicos baseados na região
        function simularClima() {
            const condicoes = ["Céu Limpo", "Parcialmente Nublado", "Estável", "Nebulosidade Dispersa"];
            const tempAleatoria = Math.floor(Math.random() * (32 - 18 + 1)) + 18;
            weatherCondition.textContent = condicoes[Math.floor(Math.random() * condicoes.length)];
            weatherTemp.textContent = `${tempAleatoria}°C`;
        }

        async function fetchAddress(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
                    headers: { 'Accept-Language': 'pt-BR' }
                });
                const data = await response.json();
                if (data && data.display_name) {
                    inputLocal.value = data.display_name;
                } else {
                    inputLocal.value = `Lat: ${lat}, Lng: ${lng}`;
                }
            } catch (error) {
                console.warn("Falha no geocode reverso.", error);
                inputLocal.value = `Lat: ${lat}, Lng: ${lng}`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!navigator.geolocation) {
                geoStatus.className = "status-box error";
                geoStatus.innerHTML = "Geolocalização não suportada.";
                inputLocal.removeAttribute('readonly');
                inputLat.removeAttribute('readonly');
                inputLng.removeAttribute('readonly');
                submitBtn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    inputLat.value = lat;
                    inputLng.value = lng;

                    geoStatus.className = "status-box success";
                    geoStatus.innerHTML = '<div class="pulse-
